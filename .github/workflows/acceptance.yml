name: Deep interaction acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:fixtures
      - run: node scripts/acceptance-report.mjs
      - run: npm run test:mermaid
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-acceptance-evidence
          path: |
            outputs/playwright-report/
            outputs/playwright-artifacts/
            outputs/playwright-results.json
          retention-days: 14
